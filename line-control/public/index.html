<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AI PROJECT CONTROL</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#0b0d12;color:#fff}
*{box-sizing:border-box}body{margin:0;background:#0b0d12}.wrap{max-width:760px;margin:auto;padding:20px 14px 40px}.head{position:sticky;top:0;background:rgba(11,13,18,.92);backdrop-filter:blur(12px);padding:12px 0 14px;z-index:5}.title{font-size:20px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.sum,.card{background:#151923;border:1px solid #252b38;border-radius:16px}.sum{padding:10px;text-align:center}.sum b{display:block;font-size:20px}.list{display:grid;gap:10px;margin-top:14px}.card{padding:14px}.row{display:flex;align-items:center;gap:10px}.name{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;opacity:.72;margin:7px 0 12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{border:0;border-radius:12px;padding:11px 8px;font-weight:700;background:#272d3a;color:#fff}button.primary{background:#1677ff}button.retry{background:#8c4cff}.err{padding:16px;background:#331b1b;border-radius:14px}.tiny{font-size:12px;opacity:.65;margin-top:8px}@media(max-width:520px){.summary{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="wrap"><section class="head"><div class="title">🤖 AI PROJECT CONTROL</div><div id="summary" class="summary"></div><div class="tiny" id="updated"></div></section><section id="list" class="list"></section></main>
<script>
const icons={green:'🟢',yellow:'🟡',red:'🔴',blue:'🔵'};
const labels={green:'正常',yellow:'停滞',red:'停止/失敗',blue:'あなた待ち'};
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function cmd(repository,command,button){button.disabled=true;const old=button.textContent;button.textContent='送信中…';try{const r=await fetch('/api/command',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository,command})});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||j.message||'failed');button.textContent='✅ 完了';setTimeout(load,900)}catch(e){button.textContent='❌ 失敗';alert(e.message)}finally{setTimeout(()=>{button.disabled=false;button.textContent=old},1800)}}
async function load(){const list=document.getElementById('list');try{const r=await fetch('/api/status',{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'status error');document.getElementById('summary').innerHTML=['green','yellow','red','blue'].map(k=>`<div class="sum"><span>${icons[k]} ${labels[k]}</span><b>${data.counts[k]||0}</b></div>`).join('');document.getElementById('updated').textContent=`${data.repositories.length} repositories / ${new Date(data.generatedAt).toLocaleString('ja-JP')}`;list.innerHTML=data.repositories.map(p=>`<article class="card"><div class="row"><span>${icons[p.signal]||'⚪'}</span><div class="name">${esc(p.name)}</div></div><div class="meta">${esc(labels[p.signal]||p.signal)} ・ ${esc(p.reason||'')} ・ 最終活動 ${p.ageMinutes==null?'不明':p.ageMinutes+'分前'} ・ PR ${p.openPrs??'-'} / Issue ${p.openIssues??'-'}</div><div class="actions"><button class="primary" onclick="cmd('${esc(p.fullName)}','continue',this)">▶ 進めて</button><button onclick="cmd('${esc(p.fullName)}','resume',this)">↻ 再開</button><button class="retry" onclick="cmd('${esc(p.fullName)}','retry_failed',this)">🔧 再実行</button></div></article>`).join('')}catch(e){list.innerHTML=`<div class="err">状態取得に失敗: ${esc(e.message)}</div>`}}
load();setInterval(load,60000);
</script></body></html>
